import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'maven-publish'

group = 'com.hotcodepush'
// Until the library is on Maven Central, a version is the full sha of the commit it is built from.
version = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()

android {
    namespace = 'com.hotcodepush.core'
    compileSdk = 36
    defaultConfig {
        minSdk = 23
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                // NDK r27 aligns a library's segments for 4 KB pages unless asked; Google Play requires 16 KB.
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
            version = '3.22.1'
        }
    }
    sourceSets {
        // The on-device tests read the same fixtures the JVM tests read, packaged as their assets, and share their download fakes.
        androidTest.assets.srcDirs += 'node_modules/@hotcodepush/protocol/fixtures'
        androidTest.java.srcDirs += 'src/sharedTest/java'
        test.java.srcDirs += 'src/sharedTest/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        abortOnError = true
    }
    publishing {
        singleVariant('release')
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // OkHttp 4, never 5: React Native's okhttp-urlconnection 4.9.2 calls okhttp3.internal.Util, which OkHttp 5 removed, so the
    // core forcing OkHttp 5 into an app throws NoClassDefFoundError from every request to a host that sets a cookie.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-urlconnection:4.9.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-urlconnection:4.9.2'
}

// The tests read the fixtures and the schema of the installed protocol package at run time: a new pin reruns them.
tasks.withType(Test).configureEach {
    inputs.dir('node_modules/@hotcodepush/protocol').withPropertyName('protocolPackage').withPathSensitivity(PathSensitivity.RELATIVE)
}

// The release AAR as a Maven publication; CI publishes it into its checkout of the maven branch, the directory -PmavenBranchDir names.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'core-android'
            }
        }
        def mavenBranchDir = findProperty('mavenBranchDir')
        if (mavenBranchDir) {
            repositories {
                maven {
                    name = 'mavenBranch'
                    url = file(mavenBranchDir)
                }
            }
        }
    }
}
