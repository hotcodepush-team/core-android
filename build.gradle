import com.vanniktech.maven.publish.AndroidSingleVariantLibrary
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.23.8'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.10.4'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.vanniktech.maven.publish'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'com.diffplug.spotless'

// A release build, -Prelease, keeps the version release-please writes into gradle.properties.
// Every other build is versioned by the full sha of its commit, the pin the maven branch serves.
if (!providers.gradleProperty('release').present) {
    version = providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
}

android {
    namespace = 'com.hotcodepush.core'
    compileSdk = 36
    defaultConfig {
        minSdk = 23
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                // NDK r27 aligns a library's segments for 4 KB pages unless asked; Google Play requires 16 KB.
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
            version = '3.22.1'
        }
    }
    sourceSets {
        // The on-device tests read the same fixtures the JVM tests read, packaged as their assets, and share their fakes and fixture readers.
        androidTest.assets.srcDirs += 'node_modules/@hotcodepush/protocol/fixtures'
        androidTest.java.srcDirs += 'src/sharedTest/java'
        test.java.srcDirs += 'src/sharedTest/java'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint {
        abortOnError = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
}

detekt {
    config.setFrom('detekt.yml')
    source.setFrom('src/main/java', 'src/test/java', 'src/sharedTest/java', 'src/androidTest/java')
}

spotless {
    kotlin {
        target('src/**/*.kt')
        // The default style, except the line length: the code keeps one statement per line, as detekt allows.
        ktlint('1.8.0').editorConfigOverride(['ktlint_standard_max-line-length': 'disabled'])
    }
}

// Detekt 1.23 runs on the Kotlin compiler it was built with; the Kotlin plugin would otherwise move it to the project's.
configurations.matching { it.name == 'detekt' }.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.jetbrains.kotlin') {
            useVersion('2.0.21')
        }
    }
}

tasks.matching { it.name == 'lint' }.configureEach {
    dependsOn('detekt', 'spotlessCheck')
}

dependencies {
    // OkHttp 4, never 5: React Native's okhttp-urlconnection 4.9.2 calls okhttp3.internal.Util, which OkHttp 5 removed.
    // Forcing OkHttp 5 into an app breaks every request to a host that sets a cookie.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-urlconnection:4.9.2'
}

// The tests read the fixtures and the schema of the installed protocol package at run time: a new pin reruns them.
tasks.withType(Test).configureEach {
    inputs.dir('node_modules/@hotcodepush/protocol').withPropertyName('protocolPackage').withPathSensitivity(PathSensitivity.RELATIVE)
}

// The release AAR as one publication for the maven branch, the release zip and Maven Central.
// The Central job alone passes -PmavenCentralPublishing and -PsignAllPublications, so the other two stay unsigned.
mavenPublishing {
    // Central requires a javadoc jar and AGP's javadoc task fails on Kotlin sources, so the default empty one ships.
    configure(new AndroidSingleVariantLibrary())
    coordinates('com.hotcodepush', 'core-android', version.toString())
    pom {
        name = 'HotCodePush Core for Android'
        description = 'The HotCodePush update protocol client every HotCodePush SDK on Android runs.'
        inceptionYear = '2026'
        url = 'https://hotcodepush.com'
        organization {
            name = 'HotCodePush'
            url = 'https://hotcodepush.com'
        }
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = 'hotcodepush-team'
                name = 'HotCodePush'
                url = 'https://hotcodepush.com'
            }
        }
        scm {
            url = 'https://github.com/hotcodepush-team/core-android'
            connection = 'scm:git:git://github.com/hotcodepush-team/core-android.git'
            developerConnection = 'scm:git:ssh://git@github.com/hotcodepush-team/core-android.git'
        }
    }
}

// CI publishes into its checkout of the maven branch, the directory -PmavenBranchDir names.
def mavenBranchDir = findProperty('mavenBranchDir')
if (mavenBranchDir) {
    publishing {
        repositories {
            maven {
                name = 'mavenBranch'
                url = file(mavenBranchDir)
            }
        }
    }
}
