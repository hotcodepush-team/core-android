name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'hotcodepush-team/core-android'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  maven-zip:
    name: Attach the Maven-layout zip to the release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      ZIP: core-android-${{ needs.release-please.outputs.version }}-maven.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew publishReleasePublicationToMavenBranchRepository -Prelease -PmavenBranchDir="$RUNNER_TEMP/maven" --console=plain
      - name: Refuse a publication under another version than the tag's
        run: test -e "$RUNNER_TEMP/maven/com/hotcodepush/core-android/$VERSION/core-android-$VERSION.aar"
      - name: Zip the Maven layout
        working-directory: ${{ runner.temp }}/maven
        run: zip -r "$RUNNER_TEMP/$ZIP" com
      - run: gh release upload "$TAG" "$RUNNER_TEMP/$ZIP"
      - name: Write the checksum the bridges pin
        run: |
          checksum=$(sha256sum "$RUNNER_TEMP/$ZIP" | cut -d ' ' -f 1)
          echo "SHA-256: \`$checksum\`" >> "$GITHUB_STEP_SUMMARY"
