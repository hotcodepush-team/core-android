name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Attach the zip and upload to Maven Central again for this existing release, e.g. 0.3.0; empty runs release-please
        type: string
        default: ''

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'hotcodepush-team/core-android' && inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  maven-zip:
    name: Attach the Maven-layout zip to the release
    needs: release-please
    # A dispatch with a tag attaches the zip to that release again, so a failed upload never needs a new release.
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      VERSION: ${{ inputs.tag || needs.release-please.outputs.version }}
      # Not ZIP: Info-ZIP reads an environment variable of that name as its default options.
      ARCHIVE: core-android-${{ inputs.tag || needs.release-please.outputs.version }}-maven.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew publishMavenPublicationToMavenBranchRepository -Prelease -PmavenBranchDir="$RUNNER_TEMP/maven" --console=plain
      - name: Refuse a publication under another version than the tag's
        run: test -e "$RUNNER_TEMP/maven/com/hotcodepush/core-android/$VERSION/core-android-$VERSION.aar"
      - name: Zip the Maven layout into the workspace
        run: |
          (cd "$RUNNER_TEMP/maven" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" com)
          ls -l "$ARCHIVE"
      - run: gh release upload "$TAG" "$ARCHIVE" --clobber
      - name: Write the checksum the bridges pin
        run: |
          checksum=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)
          echo "SHA-256: \`$checksum\`" >> "$GITHUB_STEP_SUMMARY"

  maven-central:
    name: Upload the release to Maven Central
    needs: release-please
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The upload waits in the Central Portal until someone publishes it there: a version on Central can never be deleted.
      - run: ./gradlew publishToMavenCentral -Prelease -PmavenCentralPublishing=true -PsignAllPublications=true --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
